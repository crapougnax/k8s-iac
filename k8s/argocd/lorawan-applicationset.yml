apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lorawan-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bradtech-oss/stack.git
    targetRevision: HEAD
    path: k8s/lorawan/base
  destination:
    server: https://kubernetes.default.svc
    namespace: lorawan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
