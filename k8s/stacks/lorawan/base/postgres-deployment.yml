apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lorawan
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: chirpstack
            - name: POSTGRES_USER
              value: chirpstack
            - name: POSTGRES_PASSWORD
              value: chirpstack
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lorawan
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
