apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default-cert
  namespace: traefik
spec:
  secretName: traefik-default-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: eu1.paris.qtrn.io
  dnsNames:
    - eu1.paris.qtrn.io
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
spec:
  defaultCertificate:
    secretName: traefik-default-tls
